name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketlarni o'rnatish
        run: npm install

      - name: Android loyiha yaratish
        run: npx cap add android

      - name: Ikonka va splash yaratish
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Web fayllarni nusxalash
        run: npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AZ-Learn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AZ-Learn-APK
          path: AZ-Learn.apk

      - name: Releases ga chiqarish (telefondan yuklab olish uchun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AZ Learn APK #${{ github.run_number }}
          files: AZ-Learn.apk
